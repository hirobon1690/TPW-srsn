name: Release

# Builds chrome.zip and firefox.zip and publishes them as the only release.
on:
  push:
    branches: [srsn]
    paths:
      - "src/**"
      - "tools/build-release.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        run: bash tools/build-release.sh build/release

      - name: Choose the tag
        id: tag
        run: |
          version=$(jq -r .version src/manifest.json)
          # Tags remain after older releases are deleted, so choose the next number from tags.
          tag_refs=$(git ls-remote --refs --tags origin "v${version}-srsn.*")
          last=$(printf '%s\n' "$tag_refs" | awk -F/ -v prefix="v${version}-srsn." '
            {
              tag = $NF
              if (substr(tag, 1, length(prefix)) == prefix) {
                number = substr(tag, length(prefix) + 1)
                if (number ~ /^[0-9]+$/ && number + 0 > last) last = number + 0
              }
            }
            END { print last + 0 }
          ')
          echo "tag=v${version}-srsn.$(( last + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            build/release/chrome.zip build/release/firefox.zip \
            --target "$GITHUB_SHA" \
            --title "TWP-srsn ${{ steps.tag.outputs.tag }}" \
            --notes ""

      - name: Delete the older releases (their tags are kept)
        run: |
          # gh release delete leaves the tag in place without --cleanup-tag.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | { grep -vx "${{ steps.tag.outputs.tag }}" || true; } \
            | while read -r tag; do
                gh release delete "$tag" --yes
              done
